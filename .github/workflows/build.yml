name: Build Custom APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
      web_url:
        description: 'URL WebView'
        required: true
      icon_url:
        description: 'URL Icon'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # KITA BALIKIN KE JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Proses Config & Icon
        run: |
          cd 01.WebViewStarterTemplate
          chmod +x gradlew
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ github.event.inputs.app_name }}</string>|g" app/src/main/res/values/strings.xml
          find . -name "MainActivity.java" -exec sed -i "s|https://www.google.com|${{ github.event.inputs.web_url }}|g" {} +
          wget -O app/src/main/res/mipmap-hdpi/ic_launcher.png "${{ github.event.inputs.icon_url }}" || true
          wget -O app/src/main/res/mipmap-mdpi/ic_launcher.png "${{ github.event.inputs.icon_url }}" || true
          wget -O app/src/main/res/mipmap-xhdpi/ic_launcher.png "${{ github.event.inputs.icon_url }}" || true
          wget -O app/src/main/res/mipmap-xxhdpi/ic_launcher.png "${{ github.event.inputs.icon_url }}" || true
          wget -O app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "${{ github.event.inputs.icon_url }}" || true

      - name: Build APK
        run: |
          cd 01.WebViewStarterTemplate
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: 01.WebViewStarterTemplate/app/build/outputs/apk/debug/app-debug.apk
